<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial de Pedidos - El Artesano</title>
    <link rel="icon" type="image/png" href="/img/Logo.png">
    <script src="/js/auth.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: url('https://images.unsplash.com/photo-1513104890138-7c749659a591?q=80&w=2070&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover;
            background-color: #2b2b2b;
            background-blend-mode: overlay;
        }
        .navbar-glass {
            background: rgba(0, 0, 0, .4);
            border-bottom: 1px solid rgba(255,255,255,.1);
        }
        .content-panel {
            background: rgba(255,255,255,.12);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid rgba(255,255,255,.25);
            color: #fff;
        }
        .navbar-brand { color: #fff !important; font-weight: 700; letter-spacing: 1px; }
        .content-panel { border-radius: 20px; padding: 30px; margin-top: 30px; animation: fadeIn .8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .page-heading { display: flex; justify-content: space-between; align-items: end; gap: 16px; margin-bottom: 24px; }
        .page-heading h1 { font-size: clamp(1.7rem, 4vw, 2.4rem); margin: 0; }
        .page-heading p { color: rgba(255,255,255,.65); margin: 5px 0 0; }
        .btn-back, .btn-logout { color: #fff; border: none; border-radius: 8px; font-weight: 600; padding: 6px 15px; }
        .btn-back { background: rgba(255,255,255,.1); }
        .btn-logout { background: #d94b58; }
        .btn-back:hover, .btn-logout:hover { color: #fff; filter: brightness(1.12); }
        .form-control, .form-select, .status-select { background-color: rgba(255,255,255,.1); color: #fff; border-color: rgba(255,255,255,.22); }
        .form-control::placeholder { color: rgba(255,255,255,.55); }
        .form-select option { color: #111; }
        .table { --bs-table-bg: transparent; --bs-table-color: #fff; --bs-table-border-color: rgba(255,255,255,.12); vertical-align: middle; }
        .table thead th { color: #8de0c0; font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
        .table tbody tr:hover { background: rgba(255,255,255,.06); }
        .order-id { color: rgba(255,255,255,.56); font-family: monospace; font-size: .78rem; }
        .badge-estado { border-radius: 5px; font-weight: 600; }
        .action-cell { min-width: 190px; }
        .status-select { min-width: 140px; font-size: .82rem; }
        .status-select option { color: #111; }
        .btn-guardar { background: linear-gradient(135deg, #2ed573, #7bed9f); border: none; color: #16251d; font-weight: 600; }
        .btn-guardar:hover { color: #16251d; filter: brightness(1.08); }
        .empty-state { color: rgba(255,255,255,.65); padding: 48px 12px !important; text-align: center; }
        .empty-state i { color: #8de0c0; font-size: 2rem; margin-bottom: 10px; }
        @media (max-width: 700px) { .content-panel { padding: 22px 12px; } .page-heading { align-items: start; flex-direction: column; } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-glass">
        <div class="container">
            <a class="navbar-brand" href="#"><i class="fas fa-chart-line me-2"></i>El Artesano - Historial de Pedidos</a>
            <div class="d-flex align-items-center ms-auto">
                <a href="#" id="btnVolverPanel" class="btn btn-outline-light me-3 btn-sm"><i class="fas fa-arrow-left me-1"></i> Volver al Panel</a>
                <button class="btn btn-logout" onclick="cerrarSesion()">Cerrar Sesión <i class="fas fa-sign-out-alt ms-1"></i></button>
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        <section class="content-panel">
            <div class="page-heading">
                <div>
                    <h1>Historial de pedidos</h1>
                    <p>Consulta y actualiza el estado de los pedidos registrados.</p>
                </div>
                <span id="totalPedidos" class="badge text-bg-success">0 pedidos</span>
            </div>
            <div id="alertHistorial" class="alert d-none" role="alert"></div>
            <div class="row g-3 mb-4">
                <div class="col-md-7">
                    <label class="visually-hidden" for="buscarPedido">Buscar pedido</label>
                    <div class="input-group">
                        <span class="input-group-text"><i class="fas fa-search"></i></span>
                        <input id="buscarPedido" class="form-control" type="search" placeholder="Buscar por mesa, mesero o platillo">
                    </div>
                </div>
                <div class="col-md-5">
                    <label class="visually-hidden" for="filtroEstado">Filtrar por estado</label>
                    <select id="filtroEstado" class="form-select">
                        <option value="TODOS">Todos los estados</option>
                        <option value="PENDIENTE">Pendiente</option>
                        <option value="EN_PREPARACION">En preparacion</option>
                        <option value="SERVIDO">Servido</option>
                        <option value="PAGADO">Pagado</option>
                        <option value="CANCELADO">Cancelado</option>
                    </select>
                </div>
            </div>
            <div class="table-responsive">
                <table class="table">
                    <thead>
                        <tr><th>Pedido</th><th>Fecha</th><th>Mesa</th><th>Mesero</th><th>Detalle</th><th>Estado</th><th class="text-end">Total</th><th>Acciones</th></tr>
                    </thead>
                    <tbody id="tablaPedidos"></tbody>
                </table>
            </div>
        </section>
    </main>
    <script src="/js/historial-pedidos.js"></script>
</body>
</html>
